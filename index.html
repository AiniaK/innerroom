<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>內在房間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL room; paper-card UI floats above it. Single warm-cream look by choice. */
:root{
  --paper:#FBF6EC; --paper-2:#F2E8D8; --ink:#3A3029; --muted:#857563; --line:#E2D4BF;
  --ember:#B26E39; --sage:#76825F; --veil:rgba(58,48,41,.42);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"LXGW WenKai TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --paper-img:none;
  color-scheme:light;
}
[hidden]{display:none!important}   /* anything marked hidden stays hidden, even the full-screen veils */
/* paper grain over the whole scene */
#paper,#vignette{position:fixed;inset:0;pointer-events:none;z-index:2}
#paper{background-image:var(--paper-img);background-size:520px;mix-blend-mode:multiply;opacity:.95}
#vignette{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(110,78,48,.22) 100%);mix-blend-mode:multiply}
html,body{height:100%;margin:0;overflow:hidden;background:#EAE0CF;color:var(--ink);font-family:var(--f-body);}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
.chip{background:rgba(251,246,236,.82);backdrop-filter:blur(6px);border:1px solid rgba(226,212,191,.9);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.gear{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:6;pointer-events:auto;cursor:pointer;font:inherit;font-size:12.5px}
.snd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:6;width:42px;height:42px;border-radius:50%;padding:0;cursor:pointer;
  background:rgba(251,246,236,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(226,212,191,.9);color:var(--ink);display:grid;place-items:center;transition:background .2s,opacity .2s}
.snd:hover{background:rgba(255,252,246,.95)}
.snd i{display:block;width:2.4px;border-radius:2px;background:var(--ink);margin:0 1.6px;height:var(--h);transition:height .25s}
.snd span{display:flex;align-items:center;height:20px}
.snd:not(.off) i{animation:sndb 1.1s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes sndb{from{height:calc(var(--h)*.55)}to{height:var(--h)}}
.snd.off{opacity:.75}.snd.off i{height:3px!important;animation:none}
.snd.gear{right:calc(14px + env(safe-area-inset-right,0px));font-size:0}
.gear:focus-visible,.snd:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,252,245,.9);box-shadow:0 0 0 1px rgba(58,48,41,.35);z-index:4;pointer-events:none;transition:transform .15s}
#cross.on{transform:scale(1.8);background:#fff}
#hover{position:fixed;left:50%;top:calc(50% + 20px);transform:translateX(-50%);z-index:4;pointer-events:none;text-align:center}
#hover .n{font-family:var(--f-display);font-size:15px;color:#fffaf0;text-shadow:0 1px 6px rgba(40,30,20,.65)}
#hover .h{font-size:11.5px;color:rgba(255,250,240,.85);text-shadow:0 1px 4px rgba(40,30,20,.6);margin-top:2px;letter-spacing:.06em}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;max-width:min(560px,calc(100vw - 32px));text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#toast.show{opacity:1}
#toast span{display:inline-block;background:rgba(251,246,236,.92);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13.5px;line-height:1.6}
/* overlays */
.veil{position:fixed;inset:0;z-index:10;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper) var(--paper-img);background-size:420px;border:1px solid var(--line);border-radius:6px;box-shadow:0 30px 80px rgba(40,28,18,.28);width:min(560px,100%);max-height:100%;overflow:auto;padding:28px 28px 24px;position:relative;min-width:0}
.card h2{font-family:var(--f-display);font-weight:600;font-size:23px;margin:0 0 4px;text-wrap:balance;letter-spacing:.03em}
.card .eyebrow{font-size:11.5px;letter-spacing:.18em;color:var(--muted);margin-bottom:10px}
.card p{line-height:1.85;font-size:14.5px;margin:.6em 0;max-width:62ch}
.card .note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:16px;line-height:1.7}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.entries{display:grid;gap:14px;margin-top:14px}
.entry{border-left:2px solid var(--line);padding:2px 0 2px 14px}
.entry .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.entry .t{font-family:var(--f-display);font-size:16.5px;margin:2px 0}
.entry .b{font-size:14px;line-height:1.8;white-space:pre-wrap}
.entry.hidden{opacity:.45}
.tools{display:flex;gap:6px;margin-top:6px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{font-size:12px;padding:4px 10px}
form.gb{display:grid;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
form.gb input,form.gb textarea,.card select{font:inherit;font-size:14px;color:var(--ink);background:#fffdf8;border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box}
form.gb textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-size:13px;color:var(--muted);letter-spacing:.05em}
input[type=range]{width:100%;accent-color:var(--ember)}
.val{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.tabs .btn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* exhibits: the enlarged picture beside its story */
.card.wide{width:min(960px,100%)}
.exhibit{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.exhibit .pic{flex:1.4 1 360px;min-width:0}
.exhibit .pic img,.exhibit .pic video{display:block;width:100%;height:auto;border:12px solid #D9B98E;border-radius:3px;box-shadow:0 10px 30px rgba(40,28,18,.25);box-sizing:border-box}
.exhibit .txt{flex:1 1 240px;min-width:0}
.exhibit .txt h2{margin-bottom:10px}
/* intro */
#intro .card{padding:34px 32px 28px}
#intro h1{font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:.12em;margin:0 0 6px}
#intro .sub{color:var(--muted);font-size:14.5px;line-height:1.8;margin:0 0 18px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;line-height:1.5;margin:0 0 22px}
.keys kbd{font-family:var(--f-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;background:#fffdf8;border-radius:4px;padding:2px 7px;white-space:nowrap}
/* joystick */
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:rgba(251,246,236,.28);border:1px solid rgba(251,246,236,.7);z-index:5;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(251,246,236,.85);box-shadow:0 2px 8px rgba(40,28,18,.25)}
#crouchBtn{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:5;font:inherit;font-size:15px;padding:14px 20px;cursor:pointer}
#crouchBtn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#pause{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:520px){.card{padding:24px 18px 20px}#intro h1{font-size:28px}}
.card.admin{position:fixed;inset:0;width:auto;max-width:none;max-height:none;border-radius:0;padding:0;overflow:auto;box-shadow:none}
.adm-top{position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 64px 12px 28px;background:var(--paper) var(--paper-img);background-size:420px;border-bottom:1px solid var(--line)}
.adm-top h2{margin:0;font-size:20px}.adm-top nav{display:flex;gap:6px;flex-wrap:wrap}.adm-top .sp{flex:1}
.adm-body{padding:8px 28px 60px;max-width:980px;margin:0 auto}
.adm-body section{margin:26px 0}.adm-body h3{font-size:16px;margin:0 0 4px}
.adm-row{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.adm-row .k{font-size:12px;color:var(--muted);padding-top:9px;word-break:break-all}
.adm-row input[type=text],.adm-row input[type=number],.adm-row textarea,.adm-row select,.adm-search{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fffdf8;color:var(--ink);width:100%;box-sizing:border-box}
.adm-row textarea{resize:vertical;min-height:58px}.adm-row .f{display:grid;gap:6px}.adm-row .opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.adm-row.ex{grid-template-columns:150px 1fr 300px}.adm-row.ex canvas{width:100%;height:auto;align-self:start;border:1px solid var(--line);border-radius:6px;background:#FBF6EC;position:sticky;top:76px}
@media (max-width:900px){.adm-row.ex{grid-template-columns:1fr}.adm-row.ex canvas{position:static;max-width:420px}}
.adm-row.off .f>input,.adm-row.off .f>textarea{opacity:.5}
@media (max-width:640px){.adm-row{grid-template-columns:1fr}.adm-top,.adm-body{padding-left:16px;padding-right:16px}}
.adm-top nav a[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.adm-top nav a{text-decoration:none}

/* daylight dial: preview any hour of today; desktop bottom-left, phone behind an icon top-left (same look as the clock chip) */
#sky{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;width:200px;box-sizing:border-box;padding:8px 10px 4px;border-radius:16px;
  background:rgba(251,246,236,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(226,212,191,.9);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#sky .top{display:flex;align-items:center;gap:8px}
#sky .t{font-family:var(--f-display);font-size:23px;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums;padding-left:2px}
#sky .now{margin-left:auto;font:inherit;font-size:11px;letter-spacing:.12em;color:var(--ink);background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
#sky canvas{display:block;width:100%;height:50px;cursor:ew-resize;margin-top:2px}
#skyBtn{display:none}
@media (pointer:coarse){
  #skyBtn{display:grid;place-items:center;position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:7;width:40px;height:40px;border-radius:12px;padding:0;cursor:pointer;
    background:rgba(251,246,236,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(226,212,191,.9);color:var(--ink)}
  .hud{left:calc(60px + env(safe-area-inset-left,0px))!important}
  #sky{left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));width:auto;top:calc(58px + env(safe-area-inset-top,0px));bottom:auto}
  #sky:not(.open){display:none}
}
/* guestbook */
#gbList{max-height:42vh;overflow:auto;padding-right:6px}
.entry.mine{opacity:.78}.gb-wait{color:var(--ember)}
.gb-quiet{border:0!important;padding:0!important;margin:0!important}
.gb-hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.gb-count{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.gb-msg{font-size:13px;color:#A8432F;min-height:1.2em;line-height:1.6}
.gb-signed,.gb-inapp,.gb-google{font-size:13px;line-height:1.75}
.gb-signed .btn{margin-left:6px}
.gb-inapp{background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gb-or{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:4px}
#gbBtn{min-height:34px}
.gb-copied{font-size:12px;color:var(--sage)}
.gb-acts{margin-top:6px;gap:6px}
.gb-edit{font:inherit;font-size:14px;color:var(--ink);background:#fffdf8;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box;min-height:84px;resize:vertical;margin-top:6px}
.gb-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.gb-whisper{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:6px;cursor:pointer}
form.gb .gb-whisper input,.gb-whisper input{width:auto;margin:0;padding:0;flex:none;accent-color:var(--ember)}
#gbAuth{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
#gbAuth:empty{display:none}
#gbAuth+form.gb{border-top:0;margin-top:10px;padding-top:0}
.gb-inapp a.btn{text-decoration:none}
.card .note a{color:var(--ember)}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="內在房間 3D 空間"></canvas>
<div id="paper"></div><div id="vignette"></div>
<div class="hud"><span class="chip" id="clock">—</span><span class="chip" id="wx">—</span></div>
<button id="skyBtn" type="button" aria-label="調整天光" aria-expanded="false" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 13l3.5-4"/><circle cx="12" cy="13.5" r="1.3" fill="currentColor"/><path d="M7 9.5l.8.6M12 6.5v1M17 9.5l-.8.6"/></svg></button>
<div id="sky" hidden role="group" aria-label="天光"><div class="top"><span class="t" id="skyT">--:--</span><button class="now" id="skyNow" type="button" hidden aria-label="回到現在">NOW</button></div><canvas id="skyC" width="380" height="100" aria-label="拖曳選擇一天中的時刻"></canvas></div>
<button class="snd" id="sndBtn" type="button" aria-label="關閉聲音" aria-pressed="true"><span><i style="--h:6px;--d:-.2s"></i><i style="--h:12px;--d:-.6s"></i><i style="--h:18px;--d:0s"></i><i style="--h:12px;--d:-.4s"></i><i style="--h:6px;--d:-.8s"></i></span></button>
<div id="cross" hidden></div>
<div id="hover" hidden><div class="n"></div><div class="h"></div></div>
<div id="pause" hidden><span class="chip">點一下畫面繼續探索</span></div>
<div id="toast"><span></span></div>
<div id="joy" hidden><i></i></div>
<button class="chip" id="crouchBtn" type="button" aria-pressed="false" hidden>蹲下</button>

<div class="veil" id="intro">
  <div class="card">
    <h1>內在房間</h1>
    <p class="sub">奶油色的房間，窗外一邊是海，一邊是山。天光跟著現實時間走。<br>慢慢走，看見什麼就伸手碰碰它。</p>
    <div class="keys" id="keys">
      <kbd>W A S D</kbd><span>走動（Shift 走快一點）</span>
      <kbd>C（按住）</kbd><span>蹲下；按住同時移動，就是蹲著走</span>
      <kbd>滑鼠</kbd><span>環顧四周</span>
      <kbd>點擊 / E</kbd><span>與準心對準的物件互動</span>
      <kbd>Esc</kbd><span>放開滑鼠、關閉視窗</span>
    </div>
    <button class="btn primary" id="enter" type="button">進入房間</button>
  </div>
</div>

<div class="veil" id="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="config.js"></script>
<script src="data/models.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- persisted state (prototype: this browser only) ---------- */
const KEY='innerRoom.v1';
const DEF={fire:50,timeMode:'real',hour:17.5,weather:'auto',owner:false,lamp:null,blamp:null,guestbook:[
  {id:'ex1',name:'（範例）路過的人',text:'這裡的光好溫柔。坐在沙發上聽海，想起很久沒有好好呼吸了。',date:'2026.10.26',hidden:false}
]};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){S=Object.assign({},DEF);}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

/* ---------- renderer ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.useLegacyLights=true;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,0.05,1500);
camera.rotation.order='YXZ';
const player={x:-0.9,z:2.7,y:1.6,yaw:0,pitch:-0.05};

/* ---------- canvas textures ---------- */
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();if(rep)t.repeat.set(rep[0],rep[1]);return t;}
/* hand-painted (gouache-like) textures: neutral warm tones, tinted by each material's colour */
const R0=rng(7);
const tone=(v,a=1)=>`rgba(${v|0},${(v*.975)|0},${(v*.93)|0},${a})`;
function strokes(g,w,h,o){ // o: {n,base,vary,len,wid,ang,jit,alpha}
  for(let i=0;i<o.n;i++){
    const x=R0()*w,y=R0()*h,len=o.len[0]+R0()*(o.len[1]-o.len[0]),wid=o.wid[0]+R0()*(o.wid[1]-o.wid[0]);
    const ang=o.ang+(R0()-.5)*o.jit,v=o.base+(R0()-.5)*2*o.vary,a=o.alpha*(.5+R0()*.5);
    for(const [dx,dy] of [[0,0],[w,0],[-w,0],[0,h],[0,-h]]){

function rbox(w,h,d,r,n=10){
  r=Math.max(0.001,Math.min(r,w/2,h/2,d/2)*0.999);

  const v=[0,0,0],inner=[0,0,0],off=[0,0,0];
  for(let i=0;i<P.count;i++){
    v[0]=P.getX(i);v[1]=P.getY(i);v[2]=P.getZ(i);
    for(let a=0;a<3;a++){const t=v[a],s=t<0?-1:1,at=Math.abs(t);
      if(at<=inR+1e-6){inner[a]=t/inR*(half[a]-r);off[a]=0;}
      else{inner[a]=s*(half[a]-r);off[a]=s*((at-inR)/(.5-inR))*r;}}
    const L=Math.hypot(off[0],off[1],off[2])||1;
    const dx=off[0]/L,dy=off[1]/L,dz=off[2]/L;
    P.setXYZ(i,inner[0]+dx*r,inner[1]+dy*r,inner[2]+dz*r);N.setXYZ(i,dx,dy,dz);
  }
  return planarUV(g,2);
}

  if(signed){box.innerHTML='<div class="gb-signed">已用 Google 登入。筆記本上只會出現你填的暱稱，不會顯示 Google 名字和大頭貼。你可以刪除自己的留言，送出 7 天內也可以編輯。<button class="btn small" type="button" id="gbOut">登出</button></div>';
    card.querySelector('#gbOut').onclick=()=>{gbSignOut();gbRefresh();};return;}
  if(gbInApp){const ext=gbInApp==='LINE'?location.href.replace(/#.*$/,'')+(location.search?'&':'?')+'openExternalBrowser=1':null;
    box.innerHTML=`<div class="gb-inapp"><b>想留言嗎？</b>留言需要用 Google 登入，但你正在 ${esc(gbInApp)} 的內建瀏覽器裡，Google 不允許在這裡登入。請改用 Safari 或 Chrome 打開這個房間：
      <div class="row" style="margin-top:8px">${ext?`<a class="btn small primary" href="${esc(ext)}">用瀏覽器開啟</a>`:''}<button class="btn small" type="button" id="gbCopy">複製連結</button><span class="gb-copied" id="gbCopied" role="status"></span></div>
      ${ext?'':'<div class="gb-or">複製後，貼到 Safari 或 Chrome 的網址列。</div>'}</div>`;
    card.querySelector('#gbCopy').onclick=async()=>{const url=location.href.replace(/#.*$/,'');let ok=false;
      try{await navigator.clipboard.writeText(url);ok=true;}catch(e){const i=document.createElement('input');i.value=url;document.body.appendChild(i);i.select();try{ok=document.execCommand('copy');}catch(_){}i.remove();}
      card.querySelector('#gbCopied').textContent=ok?'已複製':'請長按網址列複製';};
    return;}
  if(!GB_CFG.googleClientId){box.innerHTML='<div class="gb-or">留言本還在準備中。</div>';return;}
  box.innerHTML='<div class="gb-google"><div class="gb-or" style="margin:0 0 6px">用 Google 登入後就能留言。筆記本上只會顯示你自己填的暱稱。</div><div id="gbBtn"></div></div>';
  gbLoadGsi().then(()=>{const el=card.querySelector('#gbBtn');if(el)google.accounts.id.renderButton(el,{theme:'outline',size:'medium',shape:'pill',text:'signin_with',locale:'zh-TW'});})
    .catch(()=>{const el=card.querySelector('.gb-google .gb-or');if(el)el.textContent='Google 登入暫時無法載入，請稍後再試。';});}

function openGuestbook(){
  gb.openedAt=Date.now();gb.editing=null;
  openModal(`<div id="gbView"><div class="eyebrow">推薦書櫃上</div><h2>留言筆記本</h2><p>來過這裡的人留下的話。</p>
   <div class="entries" id="gbList" aria-live="polite"></div>
   ${GB_API?`<div id="gbAuth"></div>
   <form class="gb" id="gbf" novalidate hidden>
     <input id="gbName" maxlength="20" placeholder="你的暱稱（可不填）" autocomplete="nickname" aria-label="暱稱">
     <textarea id="gbText" maxlength="500" placeholder="想對這個房間說什麼？" required aria-label="留言內容"></textarea>
     <label class="gb-whisper"><input type="checkbox" id="gbWhisper"> 悄悄話：只給房主看，不會出現在筆記本上</label>
     <input class="gb-hp" id="gbHp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
     <div class="row"><button class="btn primary" type="submit" id="gbSubmit">留下這句話</button><span class="gb-count" id="gbCount">0 / 500</span></div>
   </form>
   <div class="gb-msg" id="gbMsg" role="status"></div>
   <div class="note">留言前請看<a href="privacy.html" target="_blank" rel="noopener">隱私權說明</a>：我們只公開你填的暱稱和內容。</div>`
   :'<div class="note">留言本還在準備中，很快就能在這裡留言。</div>'}</div>`);
  if(!GB_API){gb.list=[];gbRenderList();return;}
  gbRenderList('loading');gbRenderAuth();
  gbLoad(false).then(()=>gbRefresh(),()=>gbRenderList('error'));
  const f=card.querySelector('#gbf'),txt=card.querySelector('#gbText'),cnt=card.querySelector('#gbCount'),msg=card.querySelector('#gbMsg'),sub=card.querySelector('#gbSubmit');
  txt.oninput=()=>{cnt.textContent=[...txt.value].length+' / 500';};
  f.onsubmit=async e=>{e.preventDefault();msg.textContent='';
    const content=txt.value.trim(),nickname=card.querySelector('#gbName').value.trim();
    if(!content){msg.textContent=gbErr('content_empty');txt.focus();return;}
    if(!gbSignedIn()){gbSignOut();gbRefresh();msg.textContent=gbErr('expired');return;}
    sub.disabled=true;sub.textContent='送出中…';
    const whisper=card.querySelector('#gbWhisper').checked;
    try{const d=await gbPost('/api/comments',{nickname,content,whisper,credential:gb.token,elapsed:Date.now()-gb.openedAt,website:card.querySelector('#gbHp').value});
      txt.value='';cnt.textContent='0 / 500';
      card.querySelector('#gbWhisper').checked=false;
      if(d.comment){if(d.public)gb.list=[d.comment].concat((gb.list||[]).filter(c=>c.id!==d.comment.id));gb.mine=[d.comment].concat((gb.mine||[]).filter(c=>c.id!==d.comment.id));}
      toast(whisper?'悄悄話已送出，只有房主看得到':'留言已寫進筆記本');gbRenderList();}
    catch(err){msg.textContent=gbErr(err&&err.code);gbRenderAuth();}
    finally{sub.disabled=false;sub.textContent='留下這句話';}};
  // edit and delete buttons on this visitor's own comments
  card.querySelector('#gbList').addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]');if(!b)return;const row=b.closest('[data-id]'),id=row&&row.dataset.id;if(!id)return;msg.textContent='';
    const act=b.dataset.act;
    if(act==='edit'){gb.editing=id;gbRenderList();const t=card.querySelector('.gb-edit');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}return;}
    if(act==='cancel'){gb.editing=null;gbRenderList();return;}
    if(!gbSignedIn()){gbSignOut();gbRefresh();msg.textContent=gbErr('expired');return;}
    if(act==='del'&&!b.dataset.armed){b.dataset.armed='1';b.textContent='再按一次確認刪除';return;}
    b.disabled=true;
    try{
      if(act==='save'){const content=row.querySelector('.gb-edit').value.trim();if(!content){msg.textContent=gbErr('content_empty');b.disabled=false;return;}
        const whisper=row.querySelector('.gb-edit-whisper').checked;
        const d=await gbPost('/api/comments/'+encodeURIComponent(id),{credential:gb.token,content,whisper},'PATCH');
        gb.editing=null;gb.list=(gb.list||[]).filter(c=>c.id!==id);gb.mine=(gb.mine||[]).map(c=>c.id===id?d.comment:c);
        toast(whisper?'悄悄話已修改，只有房主看得到':'已送出修改，房主看過後會重新公開');}
      else if(act==='del'){await gbPost('/api/comments/'+encodeURIComponent(id)+'/delete',{credential:gb.token});
        gb.list=(gb.list||[]).filter(c=>c.id!==id);gb.mine=(gb.mine||[]).filter(c=>c.id!==id);toast('留言已刪除');}
      gbRenderList();}
    catch(err){msg.textContent=gbErr(err&&err.code);b.disabled=false;if(!gbSignedIn())gbRefresh();}});
}

(function inkAll(){return;const list=[];

(function paperGrain(){
  const c=document.createElement('canvas');c.width=c.height=520;const g=c.getContext('2d');const R=rng(31);
  g.fillStyle='rgb(251,247,239)';g.fillRect(0,0,520,520);
  for(let i=0;i<70;i++){const x=R()*520,y=R()*520,r=40+R()*120,gr=g.createRadialGradient(x,y,0,x,y,r);const v=R()<.5?'rgba(214,196,168,':'rgba(255,255,255,';gr.addColorStop(0,v+(.08+R()*.1)+')');gr.addColorStop(1,v+'0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  for(let i=0;i<900;i++){g.strokeStyle=`rgba(${150+R()*40},${130+R()*30},${100},${.05+R()*.08})`;g.lineWidth=.5+R()*.6;g.beginPath();const x=R()*520,y=R()*520,a=R()*6.28,l=4+R()*16;g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l*.5,y+Math.sin(a+1)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  const id=g.getImageData(0,0,520,520),d=id.data;for(let i=0;i<d.length;i+=4){const n=(R()-.5)*22;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.9;}g.putImageData(id,0,0);
  try{document.documentElement.style.setProperty('--paper-img',`url(${c.toDataURL('image/jpeg',.85)})`);}catch(e){}
})();

const fwd=new THREE.Vector3(),right=new THREE.Vector3();
const bob={amt:0,phase:0};const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let stepSide=0;
// the bed: walking into it you climb on and crawl over the mattress
const BED={x1:X_FOOT+.02,x2:X_HEAD-.03,z1:BZ-.98,z2:BZ+.98};
const onBedAt=(x,z)=>x>BED.x1&&x<BED.x2&&z>BED.z1&&z<BED.z2;
let crawl=0,wasOnBed=false,crouch=0,touchCrouch=false;
// sitting on a balcony chair: the view glides into the seat at sitting eye height, facing the way the chair faces; any step stands you up
const seat={x:0,z:0,yaw:0,on:false,k:0,eye:1.13,pitch:-.04};
function sitDown(a){if(seat.on){standUp();return;}const fx=Math.sin(a.ry),fz=Math.cos(a.ry);   // the chair's front
  seat.x=a.x-fx*.06;seat.z=a.z-fz*.06;seat.yaw=a.ry+Math.PI;seat.eye=1.13;seat.pitch=-.04;seat.on=true;rustle(.05);toast('坐下來，看海。移動就會起身。');}
// the desk chair: sit facing the desk
function sitHChair(){if(seat.on){standUp();return;}const C=HCHAIR,l=Math.hypot(C.fx,C.fz),fx=C.fx/l,fz=C.fz/l;seat.x=C.x-fx*.04;seat.z=C.z-fz*.04;seat.yaw=Math.atan2(-fx,-fz);seat.eye=1.13;seat.pitch=-.08;seat.on=true;rustle(.05);toast('坐在書桌椅上。移動就會起身。');}
// the armchair: sit back in it, facing where it faces
function sitArmchair(){if(seat.on){standUp();return;}const p=acLocal(0,.03);seat.x=p.x;seat.z=p.z;seat.yaw=acRot+Math.PI;seat.eye=1.05;seat.pitch=-.05;seat.on=true;rustle(.06);toast('坐在單人沙發上。移動就會起身。');}
// the bean bag: sink in low, facing the fire table
function sitBean(){if(seat.on){standUp();return;}seat.x=BB.x-BB.fx*.05;seat.z=BB.z-BB.fz*.05;seat.yaw=Math.atan2(-BB.fx,-BB.fz);seat.eye=.8;seat.pitch=-.14;seat.on=true;rustle(.08);toast('陷進懶骨頭裡，看著初心之火。移動就會起身。');}
// the ring sofa: sit wherever you pointed, on the seat between the backrest and the edge, facing outward from the middle
function sitSofa(){if(seat.on){standUp();return;}const cx=0,cz=.2,RX=.9,RZ=1.7;
  const th=Math.atan2((pickPoint.z-cz)/RZ,(pickPoint.x-cx)/RX),c=Math.cos(th),s=Math.sin(th);
  let k=.62;if(Math.abs(s)>.8)k=.7;   // toward the rounded ends, sit a little further out, clear of the backrest's tip
  seat.x=cx+RX*k*c;seat.z=cz+RZ*k*s;let nx=c/RX,nz=s/RZ;const L=Math.hypot(nx,nz);nx/=L;nz/=L;
  seat.yaw=Math.atan2(-nx,-nz);seat.eye=1.13;seat.pitch=-.04;seat.on=true;rustle(.06);toast('坐在環坐沙發上。移動就會起身。');}
// the bed: lie on your back with your head on the pillow by the mountain window, feet toward the room, looking up
function lieDown(){if(seat.on){standUp();return;}
  seat.x=X_HEAD-.62;seat.z=BZ-.5;seat.eye=MT_TOP+.17;seat.yaw=Math.PI/2;seat.pitch=1.05;seat.on=true;
  rustle(.09);setTimeout(()=>rustle(.05),450);toast('躺下來，休息一下。移動就會起身。');}
function standUp(){if(!seat.on)return;seat.on=false;rustle(.04);}
function rustle(v){if(!AC)return;const T=AC.currentTime;   // soft sheet-on-sheet friction
  const s=AC.createBufferSource();s.buffer=au.buf;
  // muffled cotton: low bandpass, everything above ~2 kHz rolled off, slow swell in and long fade out
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900+Math.random()*500;bp.Q.value=.45;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;lp.Q.value=.3;
  const g=AC.createGain();const dur=.55+Math.random()*.3;
  g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+dur*.4);g.gain.linearRampToValueAtTime(v*.5,T+dur*.7);g.gain.linearRampToValueAtTime(0,T+dur);
  s.connect(bp).connect(lp).connect(g).connect(au.master);s.start(T,Math.random()*1.2,dur+.05);}
function footstep(fast){if(!AC)return;const T=AC.currentTime;stepSide^=1;
  const out=player.z<-3.5; // balcony tiles sound a bit brighter than the wooden floor
  const s=AC.createBufferSource();s.buffer=au.buf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=(out?900:420)+Math.random()*120+stepSide*40;
  const g=AC.createGain();const v=(fast?.5:.34)*(.85+Math.random()*.3);
  g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+.012);g.gain.exponentialRampToValueAtTime(.0001,T+.16);
  s.connect(f).connect(g).connect(au.master);s.start(T,Math.random()*1.5,.2);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(out?140:95,T);o.frequency.exponentialRampToValueAtTime(50,T+.09);
  og.gain.setValueAtTime(v*.5,T);og.gain.exponentialRampToValueAtTime(.0001,T+.1);o.connect(og).connect(au.master);o.start(T);o.stop(T+.12);}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  // movement
  let speedNow=0;const sprint=!!(keys.ShiftLeft||keys.ShiftRight);
  if(started&&!modalOpen){
    let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
    let mz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;
    const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}
    if(SL.grab&&l>.01)grabSunKnob(false);
    if(seat.on&&l>.01)standUp();
    else if(l>.01&&seat.k<.05){const sp=(crawl>.5?.62:(sprint&&crouch<.5?2.6:1.5))*(crouch>.5?.55:1)*dt;
      fwd.set(-Math.sin(player.yaw),0,-Math.cos(player.yaw));right.set(Math.cos(player.yaw),0,-Math.sin(player.yaw));
      const dx=(fwd.x*mz+right.x*mx)*sp,dz=(fwd.z*mz+right.z*mx)*sp;const ox=player.x,oz=player.z;
      if(walkable(player.x+dx,player.z))player.x+=dx;if(walkable(player.x,player.z+dz))player.z+=dz;
      speedNow=Math.hypot(player.x-ox,player.z-oz)/Math.max(dt,1e-4);}
  }
  // head bob: the view rises and falls with each step, sways side to side, and settles when you stop
  // on the bed: eye height eases down to 1.45 m, movement slows, the sway becomes a gentle hands-and-knees rock
  // hold C to crouch (1.0 m on the floor, 1.15 m on the bed); moving while holding C is a low, slow walk
  const onBed=onBedAt(player.x,player.z);
  crawl=lerp(crawl,onBed?1:0,1-Math.pow(.18,dt));
  crouch=lerp(crouch,(started&&!modalOpen&&(keys.KeyC||touchCrouch))?1:0,1-Math.pow(.006,dt));
  if(onBed!==wasOnBed){rustle(.07);wasOnBed=onBed;}
  seat.k=lerp(seat.k,seat.on?1:0,1-Math.pow(.02,dt));
  if(seat.on&&seat.k<.97){let d=seat.yaw-player.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));const e=1-Math.pow(.03,dt);player.yaw+=d*e;player.pitch=lerp(player.pitch,seat.pitch,e);}   // turn toward the view as you sit or lie down
  const eyeY=lerp(lerp(lerp(1.6,1.45,crawl),lerp(1.0,1.15,crawl),crouch),seat.eye,seat.k);
  const target=clamp(speedNow/((crawl>.5?.62:1.5)*(crouch>.5?.55:1)),0,1.5);
  bob.amt=lerp(bob.amt,target,1-Math.pow(target>bob.amt?.08:.12,dt));
  const prevPhase=bob.phase;
  bob.phase+=dt*lerp(lerp(sprint&&crouch<.5?8.2:6.0,4.4,crouch),3.6,crawl)*Math.min(1,bob.amt*2.5);
  if(bob.amt<.02)bob.phase=lerp(bob.phase,Math.round(bob.phase/Math.PI)*Math.PI,1-Math.pow(.01,dt));
  const A=bob.amt*(reduceMotion?.3:1);
  const bobY=(Math.cos(bob.phase*2)-1)*lerp(.015,.012,crawl)*Math.min(A,1);
  const swayX=Math.sin(bob.phase)*lerp(.011,.028,crawl)*A;
  const roll=Math.sin(bob.phase)*lerp(.003,.016,crawl)*A,nod=Math.sin(bob.phase*2)*.006*crawl*A;
  if(crawl>.6&&bob.amt>.15&&Math.floor(prevPhase/Math.PI)!==Math.floor(bob.phase/Math.PI))rustle(.04+.02*Math.random());
  right.set(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  camera.position.set(lerp(player.x,seat.x,seat.k)+right.x*swayX,eyeY+bobY,lerp(player.z,seat.z,seat.k)+right.z*swayX);
  camera.rotation.set(player.pitch+nod,player.yaw,roll);camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  // door
  doorOpen=lerp(doorOpen,doorTarget,1-Math.pow(.02,dt));slidePanel.position.x=-3.4+doorOpen*1.15;
  // env
  skyU.uTime.value=now/1000;WIND.uTime.value=now/1000;WIND.uGust.value=1+wx.rain*.9+wx.mist*.15;
  if(now-envT>100||envT===0){updateEnv(now);envT=now;}
  for(let i=0;i<RAIN;i++){const s=rseed[i];s.y-=s.v*dt;if(s.y<-6)s.y+=22;const j=i*6;rpos[j]=s.x;rpos[j+1]=s.y;rpos[j+2]=s.z;rpos[j+3]=s.x+.02;rpos[j+4]=s.y+.38;rpos[j+5]=s.z;}
  rgeo.attributes.position.needsUpdate=true;rain.visible=wx.rain>.02;
  updateFire(dt,now);
  if(tvDoc&&!tvVideo.paused&&tvVideo.readyState>=2)drawTV();
  if(IOS&&now-(frame.shT||0)>200){frame.shT=now;shadowSync();}
  sunLampTick(dt);
  if(tabIsVideo()&&!musicEl.paused)drawTabletVideo();
  else if(now-(frame.tabT||0)>1000){frame.tabT=now;if(musicTracks().length)drawTablet();}
  if(now-hoverT>90){updateHover();hoverT=now;}
  updateAudio(dt,now);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
