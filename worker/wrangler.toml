# 內在房間 Worker 設定
# 這個檔案會進 git，所以只放「不是秘密」的設定。
# 金鑰一律用 `npx wrangler secret put 名稱` 存進 Cloudflare，不要寫在這裡。
name = "innerroom-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# 你的 GitHub repo，格式「帳號/repo 名稱」
GITHUB_REPO = "AiniaK/innerroom"
GITHUB_BRANCH = "main"
# 允許呼叫這個 Worker 的網站網址，用逗號分隔，不要有結尾的斜線。
# 本機測試用的 http://localhost:8000 上線穩定後可以拿掉。
ALLOWED_ORIGINS = "https://ainiak.github.io,http://localhost:8000"
# Google OAuth 用戶端 ID（不是秘密，和 config.js 裡的相同）
GOOGLE_CLIENT_ID = "343926158795-3cglv3m79q6n7lojtne9od790fn57bvr.apps.googleusercontent.com"
NOTION_VERSION = "2025-09-03"
# 夢境紀錄、心情筆記兩個 Notion 資料庫的 ID（不是秘密；要分享給「內在房間留言」這個連接）
NOTION_DREAM_DB = "4184acf6565180eeafead792fe198fd6"
NOTION_MOOD_DB = "4184acf656518046b80cfd332f24adb2"

# 留言快取、頻率限制、封鎖名單。id 由 `npx wrangler kv namespace create KV` 產生
[[kv_namespaces]]
binding = "KV"
id = "c05ba25758d146d7bf416aa9f3508c83"

[observability]
enabled = true

# 需要用 `npx wrangler secret put` 設定的金鑰：
#   OWNER_EMAILS        房主的 Google email（多個用逗號分隔）
#   GITHUB_TOKEN        只開放這個 repo「Contents 讀寫」的 fine-grained token
#   NOTION_TOKEN        Notion integration 的金鑰
#   NOTION_DATABASE_ID  留言資料庫的 ID
#   HASH_SECRET         一串至少 32 個字元的亂數，用來把 Google ID 和 IP 轉成無法還原的代號
